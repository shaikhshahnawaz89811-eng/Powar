name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No `submodules:` option needed -- CMakeLists.txt now fetches
        # llama.cpp itself at configure time if it isn't vendored locally.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP (com.android.application) 9.4.0, used in app/build.gradle.kts,
          # requires Gradle 9.6.0 or newer. If you bump the AGP version later,
          # check its required minimum Gradle version and bump this too.
          gradle-version: 9.6.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pawar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
